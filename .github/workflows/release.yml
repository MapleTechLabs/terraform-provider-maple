name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

jobs:
    # With changesets pending, opens or updates the "Version Packages" PR. Once it is merged,
    # tags vX.Y.Z and cuts the GitHub release; goreleaser then adds the signed assets the
    # Terraform Registry reads. It runs here, not on a tag push, because a tag pushed with
    # GITHUB_TOKEN does not start workflows.
    version:
        name: Version or tag
        # A manual run on another branch must never publish.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            - run: npm ci --no-audit --no-fund

            - id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: npm run version-packages
                  publish-script: npm run release
                  commit-message: "chore: version packages"
                  pr-title: "chore: version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - id: version
              run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

    goreleaser:
        name: Signed release assets
        needs: version
        if: needs.version.outputs.published == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  ref: v${{ needs.version.outputs.version }}
                  fetch-depth: 0

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            # The key whose public half is registered on the Registry namespace.
            - name: Import GPG key
              id: gpg
              uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.PASSPHRASE }}

            - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
                  GORELEASER_CURRENT_TAG: v${{ needs.version.outputs.version }}
